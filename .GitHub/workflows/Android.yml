
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project files
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper (gradlew) was not found in the repository root."
            exit 1
          fi
          if [ ! -f "./app/build.gradle" ] && [ ! -f "./app/build.gradle.kts" ]; then
            echo "ERROR: No Gradle build file found in the app/ directory."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instagram-autoreactor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
