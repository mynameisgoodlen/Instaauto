name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Instagram Autoreactor APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Locate Android project or extract uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            SOURCE_ZIP="$GITHUB_WORKSPACE/instagram-autoreactor-github-ready.zip"

            if [ ! -f "$SOURCE_ZIP" ]; then
              echo "::error::Android project files are missing. Upload instagram-autoreactor-github-ready.zip to the repository root, or commit the extracted project files."
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -not -path '*/.git/*' | sort | sed -n '1,100p'
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/instagram-autoreactor-source"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            echo "Extracting source archive: $SOURCE_ZIP"
            unzip -oq "$SOURCE_ZIP" -d "$EXTRACT_DIR"
            PROJECT_DIR="$EXTRACT_DIR"
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle is missing from the project root after locating/extracting the source."
            exit 1
          fi
          if [ ! -f "$PROJECT_DIR/build.gradle" ] && [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Root Gradle build file is missing."
            exit 1
          fi
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Configure the project to use the available Android SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          candidates = [project / "app" / "build.gradle", project / "app" / "build.gradle.kts"]
          build_file = next((p for p in candidates if p.is_file()), None)
          if build_file is None:
              raise SystemExit("ERROR: app/build.gradle or app/build.gradle.kts not found")

          original = build_file.read_text(encoding="utf-8")
          updated, changes = re.subn(
              r"(?m)^(\s*compileSdk\s*(?:=\s*)?)37(\s*)$",
              r"\g<1>36\g<2>",
              original,
          )
          if changes:
              build_file.write_text(updated, encoding="utf-8")
              print(f"Changed compileSdk 37 to 36 in {build_file}")
          else:
              print(f"No compileSdk 37 declaration to change in {build_file}")
          print("Build configuration:")
          for line in build_file.read_text(encoding="utf-8").splitlines():
              if "compileSdk" in line or "targetSdk" in line or "minSdk" in line:
                  print(line.strip())
          PY

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: instagram-autoreactor-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
