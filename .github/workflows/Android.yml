
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Instagram Autoreactor
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          find_settings() {
            find "$1" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -print -quit 2>/dev/null || true
          }

          SETTINGS_FILE="$(find_settings "$GITHUB_WORKSPACE")"

          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Android project or ZIP file found."
              echo "Upload the project ZIP to the repository and commit it."
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
                -not -path '*/.git/*' | sort | head -80
              exit 1
            fi

            echo "Extracting project archive: $ZIP_FILE"
            EXTRACT_DIR="$GITHUB_WORKSPACE/.ci-extracted-project"
            mkdir -p "$EXTRACT_DIR"
            unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find_settings "$EXTRACT_DIR")"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle found, even after extraction."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Verify project configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "::error::Root Gradle build file is missing."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "::error::App module build file is missing."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instagram-autoreactor-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
